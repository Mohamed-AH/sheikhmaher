name: Refresh catalog and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 0 * * *"   # daily, 03:30 Makkah time
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl maheralqahtani.org and rebuild the catalog
        run: tools/refresh.sh
      - name: Commit if anything changed
        run: |
          git config user.name "catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet -- data/catalog.json; then echo "No new lessons"; exit 0; fi
          git commit -m "Refresh lesson catalog"
          git push

  deploy:
    needs: [refresh]
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect site files
        run: mkdir _site && cp -r index.html styles.css app.js data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
