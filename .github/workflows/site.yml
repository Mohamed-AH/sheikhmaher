name: Refresh catalog and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 0 * * *"   # daily, 03:30 Makkah time
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl maheralqahtani.org and rebuild the catalog
        run: tools/refresh.sh
      - name: Commit if anything changed
        run: |
          git config user.name "catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet -- data/catalog.json; then echo "No new lessons"; exit 0; fi
          git commit -m "Refresh lesson catalog"
          # the crawl takes a while; if main moved meanwhile, put this commit on top of it. If the move changed
          # the catalog tools or the catalog itself, this crawl was built with old rules: skip, tomorrow's run redoes it
          git fetch -q origin main
          if ! git diff --quiet HEAD~1 origin/main -- tools/ data/catalog.json; then
            echo "::warning::main changed the catalog or its tools during the crawl; tomorrow's run will refresh it"; exit 0
          fi
          git rebase -q origin/main
          git push

  deploy:
    needs: [refresh]
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pages, sitemap and robots.txt
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://sheikhmaheralqahtani.com/' }}
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
          GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}
        run: python3 -I tools/build_site.py --out _site --base /sheikhmaher/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
