<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مكتبة دروس الشيخ ماهر القحطاني حفظه الله</title>
<meta name="description" content="واجهة مساندة تعرض دروس ومحاضرات وخطب فضيلة الشيخ ماهر بن ظافر القحطاني، مأخوذ من موقع معرفة السنن والآثار.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Readex+Pro:wght@300;400;500;600&family=Reem+Kufi:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#">
      <svg class="logo-mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="var(--brand)"/><path d="M20 6l4.2 9.8L34 20l-9.8 4.2L20 34l-4.2-9.8L6 20l9.8-4.2z" fill="none" stroke="var(--surface)" stroke-width="1.6"/><circle cx="20" cy="20" r="3.2" fill="var(--accent)"/></svg>
      <span>مكتبة معرفة السنن والآثار<small>للشيخ ماهر القحطاني حفظه الله</small></span>
    </a>
    <nav class="nav" aria-label="الأقسام">
      <a href="#" data-nav="home">الرئيسية</a>
      <a href="#start" data-nav="start">ابدأ من هنا</a>
      <a href="#library" data-nav="library">المكتبة</a>
      <a href="#mine" data-nav="mine">متابعتي</a>
    </nav>
    <a class="icon-btn search-mini" href="#search" aria-label="بحث"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></a>
    <button class="icon-btn" id="theme" type="button" aria-label="تبديل المظهر"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>
</header>
<main id="app"><div class="skeleton">جارٍ تحميل الفهرس…</div></main>
<footer class="site">
  <div class="wrap">
    <span>واجهة مساندة لـ<a href="https://maheralqahtani.org/" target="_blank" rel="noopener">موقع معرفة السنن والآثار</a> لفضيلة الشيخ ماهر بن ظافر القحطاني حفظه الله، وجميع المواد وحقوقها للموقع.</span>
    <span id="built"></span>
  </div>
</footer>
<div class="player" id="player" hidden>
  <div class="wrap">
    <div class="ctrl">
      <button class="icon-btn" id="pPrev" type="button" aria-label="الدرس السابق"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 6v12l10-6z" transform="rotate(180 12 12) translate(-2 0)"/><rect x="16" y="6" width="2" height="12" transform="rotate(180 12 12)"/></svg></button>
      <button class="big" id="pPlay" type="button" aria-label="تشغيل"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="icon-btn" id="pNext" type="button" aria-label="الدرس التالي"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 6v12l10-6z" transform="translate(-2 0)"/><rect x="16" y="6" width="2" height="12"/></svg></button>
    </div>
    <div class="info">
      <b id="pTitle"></b>
      <a id="pSeries" href="#"></a>
      <div class="bar"><span id="pCur" class="num">0:00</span><input id="pSeek" type="range" min="0" max="1000" value="0" aria-label="الموضع"><span id="pDur" class="num">0:00</span></div>
      <div class="err" id="pErr" hidden></div>
    </div>
    <div class="ctrl side">
      <button class="speed" id="pSpeed" type="button" aria-label="سرعة التشغيل">١×</button>
      <a class="icon-btn" id="pDl" href="#" target="_blank" rel="noopener" aria-label="تنزيل"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg></a>
    </div>
  </div>
  <audio id="audio" preload="none"></audio>
</div>
<script src="app.js"></script>
</body>
</html>
